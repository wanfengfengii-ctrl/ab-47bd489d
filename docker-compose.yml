services:
  # 健康站点：宿主 WEB_PORT（默认 8080）映射到容器内同端口
  web:
    build:
      context: .
      target: runner
    image: nitrogen-duct-certifier:web
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    restart: unless-stopped

  # 一次性服务：单元测试 → 类型检查/构建 → 有解/无解冒烟；
  # 全部通过退出码 0，任一失败退出码非 0，随后容器退出。
  # 运行：docker compose run --rm verify
  verify:
    profiles: ["verify"]
    build:
      context: .
      target: verify
    image: nitrogen-duct-certifier:verify
    restart: "no"
