services:
  web:
    build:
      context: .
      target: web
      args:
        WEB_PORT: ${WEB_PORT:-8080}
    image: nitrogen-flow-web:latest
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WEB_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 一次性认证服务：依次执行单元测试、生产构建、有解/无解冒烟，
  # 全部通过后以退出码 0 结束；任一失败以非零退出码结束。
  # 用法：docker compose build verify && docker compose run --rm verify
  verify:
    build:
      context: .
      target: verify
    image: nitrogen-flow-verify:latest
    # 命令与退出码语义在 Dockerfile 的 verify 阶段 CMD 中定义：
    # npm run test && npm run build && npm run smoke
    restart: "no"
